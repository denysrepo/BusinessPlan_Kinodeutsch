<html lang="de" style="margin: 0; padding: 0; height: 100%; overflow: hidden;"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KinoDeutsch - Business Plan</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link href="fixed-sizing.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        
        .slide-container {
            width: 100vw;
            height: 100vh;
            box-sizing: border-box;
            background: #000000;
            font-family: 'Inter', sans-serif;
            position: relative;
            overflow: hidden;
            margin: 0;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        
        .kinodeutsch-gradient {
            background: linear-gradient(135deg, #000000 0%, #1a1a1a 50%, #000000 100%);
        }
        
        .red-accent {
            color: #DC2626;
        }
        
        .red-bg {
            background-color: #DC2626;
        }
        
        .cinematic-glow {
            box-shadow: 0 0 30px rgba(220, 38, 38, 0.3);
        }
        
        .fade-in {
            animation: fadeIn 1s ease-in-out;
        }
        
        .slide-up {
            animation: slideUp 0.8s ease-out;
        }
        
        .pulse-red {
            animation: pulseRed 2s infinite;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        @keyframes slideUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        @keyframes pulseRed {
            0%, 100% { box-shadow: 0 0 20px rgba(220, 38, 38, 0.4); }
            50% { box-shadow: 0 0 40px rgba(220, 38, 38, 0.8); }
        }
        
        .hover-scale {
            transition: transform 0.3s ease;
        }
        
        .hover-scale:hover {
            transform: scale(1.05);
        }
        
        .text-shadow {
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
        }
        
        .card-dark {
            background: rgba(31, 41, 55, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(220, 38, 38, 0.2);
        }
        
        .hero-text {
            background: linear-gradient(45deg, #ffffff, #DC2626);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
    </style>

</head>
<body style="margin: 0; padding: 0; height: 100vh; overflow: hidden;">
    <div class="slide-container kinodeutsch-gradient">
        <!-- Background Pattern -->
        <div class="absolute inset-0 opacity-10">
            <div class="absolute top-0 left-0 w-full h-full" style="background-image: radial-gradient(circle at 25% 25%, #DC2626 0%, transparent 50%), radial-gradient(circle at 75% 75%, #DC2626 0%, transparent 50%);"></div>
        </div>
        
        <!-- Main Content -->
        <div class="relative z-10 text-center fade-in max-w-4xl">
            <!-- Logo -->
            <div class="mb-8 slide-up">
                <h1 class="text-6xl md:text-8xl font-black red-accent tracking-wider mb-4 cinematic-glow">
                    KINODEUTSCH
                </h1>
                <div class="w-32 h-1 red-bg mx-auto mb-6"></div>
            </div>
            
            <!-- Subtitle -->
            <div class="slide-up" style="animation-delay: 0.3s;">
                <h2 class="text-2xl md:text-4xl font-light text-white mb-4 hero-text">
                    Business Plan Präsentation
                </h2>
                <p class="text-lg md:text-xl text-gray-300 font-light tracking-wide">
                    Revolutionäres Sprachenlernen durch Kino, Serien und Shows</p>
            </div>
            
            <!-- Decorative Elements -->
            <div class="absolute top-20 left-20 w-2 h-2 red-bg rounded-full pulse-red"></div>
            <div class="absolute bottom-20 right-20 w-3 h-3 red-bg rounded-full pulse-red" style="animation-delay: 1s;"></div>
            <div class="absolute top-1/2 left-10 w-1 h-1 red-bg rounded-full pulse-red" style="animation-delay: 0.5s;"></div>
            <div class="absolute top-1/3 right-10 w-1 h-1 red-bg rounded-full pulse-red" style="animation-delay: 1.5s;"></div>
        </div>
        
        <!-- Bottom Info -->
        <div class="absolute bottom-8 left-8 text-gray-400 text-sm fade-in" style="animation-delay: 1s;">
            <p>Denys &amp; Anastasiia Repetylo</p>
            <p>2025</p>
        </div>
        
        <div class="absolute bottom-8 right-8 text-gray-400 text-sm fade-in" style="animation-delay: 1s;">
            <p>Innovative EdTech Solution</p>
        </div>
    </div>




<script src="navigation.js"></script></body></html>
